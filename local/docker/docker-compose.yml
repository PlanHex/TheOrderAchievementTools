services:
  web:
    build:
      context: ../..
      dockerfile: local/docker/Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ../../src:/var/www/html
      - ../../data:/var/www/data
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_achievements
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../../data:/data:ro
volumes:
  db_data:
